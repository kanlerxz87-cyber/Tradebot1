name: Collect market data

# The autonomous loop. Every 15 minutes it reads the public Kalshi API (no key needed),
# records prices, detects >= $0.10 swings, advances the paper-trading book, regenerates the
# static tables and publishes the site.
#
# If demo credentials are added as repository secrets (KALSHI_API_KEY_ID, KALSHI_PRIVATE_KEY)
# the demo adapter in kalshi_trader/kalshi_demo.py starts reading the demo account and mirroring
# new entries as demo orders — no code change required.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: "Collection samples per cycle"
        default: "2"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Collect one cycle
        env:
          KALSHI_DATA_ENV: prod
          KALSHI_EXECUTION: ${{ secrets.KALSHI_API_KEY_ID && 'demo' || 'paper' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_CYCLE_SAMPLES: ${{ github.event.inputs.samples || '2' }}
          KALSHI_REQUEST_INTERVAL: "0.15"
        # A failed cycle must not lose the site: fall back to the committed snapshot.
        continue-on-error: true
        run: python -m kalshi_trader.cli collect

      - name: Rebuild static tables
        run: python tools/build_site.py

      - name: Integrity checks
        run: |
          python -m kalshi_trader.cli verify || echo "::warning::data integrity check reported problems"
          python tools/check_links.py

      - name: Commit the new snapshot and ledger
        run: |
          git config user.name "kalshi-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/topics docs/index.html docs/portfolio.html docs/verification.html docs/flagged.html app_data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes this cycle"
          else
            git commit -m "data: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

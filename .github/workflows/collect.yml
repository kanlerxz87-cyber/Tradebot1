name: Collect market data

# The autonomous loop. Every 30 minutes it reads the public Kalshi API (no key needed),
# records prices, detects >= $0.10 swings, advances the paper-trading book, regenerates the
# static tables and publishes the site.
#
# If demo credentials are added as repository secrets (KALSHI_API_KEY_ID, KALSHI_PRIVATE_KEY)
# the demo adapter in kalshi_trader/kalshi_demo.py starts reading the demo account and mirroring
# new entries as demo orders — no code change required.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: "Collection samples per cycle"
        default: "2"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Collect one cycle
        env:
          KALSHI_DATA_ENV: prod
          KALSHI_EXECUTION: ${{ secrets.KALSHI_API_KEY_ID && 'demo' || 'paper' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_CYCLE_SAMPLES: ${{ github.event.inputs.samples || '2' }}
          KALSHI_REQUEST_INTERVAL: "0.15"
        # A failed cycle must not lose the site: fall back to the committed snapshot.
        continue-on-error: true
        run: python -m kalshi_trader.cli collect

      - name: Rebuild static tables
        run: python tools/build_site.py

      - name: Integrity checks
        run: |
          python -m kalshi_trader.cli verify || echo "::warning::data integrity check reported problems"
          python tools/check_links.py

      - name: Commit the new snapshot and ledger
        # Several sessions push to main all day, so a single push regularly loses the race with
        # "stale info". Retry with a rebase instead of failing the cycle.
        run: |
          set -u
          git config user.name "kalshi-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/desk app_data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes this cycle"
            exit 0
          fi
          git commit -m "data: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::could not publish this cycle after 5 attempts; the next cycle retries"

      # Pages publishes main:/ in legacy mode, so the push above is the deployment.
      # Verify the public site picked the new snapshot up rather than assuming it did.
      - name: Confirm the published site is serving
        if: always()
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://kanlerxz87-cyber.github.io/Tradebot1/docs/desk/data/meta.json)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::published site did not answer 200 within ~5 minutes"

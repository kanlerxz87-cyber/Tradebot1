name: Collect market data

# The autonomous loop. Every 30 minutes it reads only the public Kalshi demo API,
# records prices, detects >= $0.10 swings, advances the paper-trading book, regenerates the
# static tables and publishes the site.
#
# If demo credentials are added as repository secrets (KALSHI_API_KEY_ID, KALSHI_PRIVATE_KEY)
# the demo adapter in kalshi_trader/kalshi_demo.py can read the demo account and mirror
# eligible entries as demo orders — no production account or endpoint is used.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: "Collection samples per cycle"
        default: "2"
        required: false

permissions:
  contents: write

# Shares a group with pages.yml: both jobs commit to main and must never push concurrently.
concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Collect one cycle
        env:
          KALSHI_DATA_ENV: demo
          KALSHI_EXECUTION: ${{ secrets.KALSHI_API_KEY_ID && 'demo' || 'paper' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_CYCLE_SAMPLES: ${{ github.event.inputs.samples || '2' }}
          KALSHI_REQUEST_INTERVAL: "0.15"
        # A failed cycle must not lose the site: fall back to the committed snapshot.
        continue-on-error: true
        run: python -m kalshi_trader.cli collect

      - name: Rebuild every page that embeds this cycle's data
        # tools/build_site.py writes the desk's tables; live/build_page.py writes live.html from the
        # same snapshot. Both must be rebuilt here, or live.html goes stale on every cycle and the
        # deploy workflow's `live/build_page.py --check` step fails.
        run: |
          python tools/build_site.py
          python live/build_page.py

      - name: Integrity checks
        run: |
          python -m kalshi_trader.cli verify || echo "::warning::data integrity check reported problems"
          python tools/check_links.py

      - name: Commit the new snapshot and ledger
        run: |
          git config user.name "kalshi-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/desk app_data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes this cycle"
          else
            git commit -m "data: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed; retrying"; sleep 10
            done
          fi

      # Pages publishes main:/ in legacy mode, so the push above is the deployment.
      # Verify the public site picked the new snapshot up rather than assuming it did.
      - name: Confirm the published site is serving
        if: always()
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://kanlerxz87-cyber.github.io/Tradebot1/docs/desk/data/meta.json)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::published site did not answer 200 within ~5 minutes"

name: Kalshi connectivity probe
on:
  push:
    branches: [arena/aa20f459-tradebot1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run connectivity probe against Kalshi demo hosts
        run: node probe/kalshi-probe.mjs
      - name: Publish evidence to job summary
        run: |
          {
            echo '## Kalshi demo connectivity probe'
            echo 'Generated by the runner; raw results committed to `probe/results.json` on the branch.'
            echo '```json'
            cat probe/results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results.json
          if git diff --staged --quiet; then
            echo "results.json unchanged — nothing to commit"
          else
            git commit -m "Record connectivity probe results [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-connectivity-probe
          path: probe/results.json

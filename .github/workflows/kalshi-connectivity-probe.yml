name: Kalshi connectivity probe
on:
  push:
    branches: [arena/aa20f459-tradebot1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run connectivity probe against Kalshi demo hosts
        run: node probe/kalshi-probe.mjs
      - name: Publish verdict to job summary
        run: |
          echo '## Kalshi demo connectivity probe' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./probe/results.json');console.log(JSON.stringify({generated_at:r.generated_at,runner:r.runner,verdicts:r.verdicts},null,2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-connectivity-probe
          path: probe/results.json

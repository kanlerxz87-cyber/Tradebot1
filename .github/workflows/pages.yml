name: Verify and deploy Kalshi research dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      refresh_snapshot:
        description: Persist an official public snapshot on the active integration branch only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/kalshi/requirements.lock
      - run: python -m pip install -r services/kalshi/requirements.lock
      - name: Test demo safety, signatures, accounting, sources and HTTP boundaries
        run: |
          python -m pytest services/kalshi/tests -q
          python -m ruff check services/kalshi/kalshi_demo services/kalshi/tests
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/kalshi/browser-check/package-lock.json
      - run: npm ci --prefix services/kalshi/browser-check --ignore-scripts
      - name: Real Chromium — desktop, mobile, public-data separation and mocked adapters
        run: npm test --prefix services/kalshi/browser-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            services/kalshi/data/browser-results/report.json
            services/kalshi/data/browser-results/*.png
          if-no-files-found: ignore
  snapshot-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_snapshot && github.ref == 'refs/heads/arena/6addd9fe-tradebot1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6addd9fe-tradebot1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official public demo observations
        run: python scripts/build_snapshot.py
      - name: Persist only the public snapshot on the assigned branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-linked public demo snapshot (not live)'
            git pull --rebase origin arena/6addd9fe-tradebot1
            git push origin arena/6addd9fe-tradebot1
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify browser logic, source links and preserved earlier work
        run: |
          python scripts/build_site.py
          git diff --exit-code -- docs/
          node --test tests/*.test.mjs
          python tests/check_site.py
          python python/test_simulator.py
          node --check docs/assets/app.mjs
          node --check site/assets/app.js
      - name: Fetch bounded public demo snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python scripts/build_snapshot.py
          python tests/check_site.py
      - name: Stage public sites only — never keys, SQLite, or backend files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp index.html .nojekyll public/
          cp -R docs site public/
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: public-source-snapshot
          path: docs/data/snapshot.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, backend-tests, browser-tests]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Prefer a single Actions publishing source to prevent legacy overwrite races
        id: publishing-mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/${{ github.repository }}/pages -f build_type=workflow
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy site

# GitHub Pages for this repository publishes `main` from the repository root in legacy mode,
# so a push to main is the deployment. That also means a workflow-crafted artifact cannot be
# deployed (the Pages API rejects build_type changes from this token), so this job only gates
# the build: it fails loudly if the committed site is stale or has broken links.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "kalshi_trader/**"
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-checks
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild generated tables from the committed snapshot
        run: python tools/build_site.py

      - name: Site must be current and fully linked
        run: |
          python tools/build_site.py --check
          python tools/check_links.py

      - name: Gateway page points at a real target
        run: |
          set -e
          grep -q 'url=docs/' index.html
          test -f docs/index.html
          echo "root gateway → docs/index.html ok"

      - name: Wait for the published site to serve the new build
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://kanlerxz87-cyber.github.io/Tradebot1/docs/index.html)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::published site did not answer 200 within ~5 minutes"

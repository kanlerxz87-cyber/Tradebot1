name: Verify and deploy both Pages dashboards
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# `pages` and `collect` both commit to main. They are deliberately placed in the same
# concurrency group so the two push steps can never overlap (observed collision:
# runs 44997857586 and 44997863523 started in the same minute).
concurrency:
  group: main-writers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify both sessions' code and local links
        run: |
          npm install --no-audit --no-fund
          # Regenerate the Node site from the committed data before checking it. The generated
          # pages at the repository root had drifted from their templates and data (build:check
          # reported 19 stale pages on a clean clone of main), because nothing in CI ran `build`
          # — the workflow only staged whatever HTML happened to be committed. Building here
          # makes the deployed artifact match the templates and the current data every deploy,
          # and build:check below then proves the regeneration is deterministic.
          npm run build
          node --test tests/*.test.mjs
          npm run build:check
          npm run check:data
          python3 tests/check_site.py
          python3 python/test_simulator.py
          node --check site/assets/app.js
      # Research desk (session e3e5f70f): unit tests, generated tables current, no broken links.
      - name: Verify the research desk under docs/desk
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pytest -q
          python3 tools/build_site.py --check
          python3 tools/check_links.py
      - name: Verify the engine site (session arena-7ae1c34f)
        run: |
          python3 -m engine.check_site --root docs/engine
          python3 -m engine.build_site --out /tmp/engine-site --data docs/engine/data
          python3 -m engine.check_site --root /tmp/engine-site
      # Session arena-35fb0d1f: the live desk's 29 unit tests, its generated page, and the
      # cross-implementation data audit. --check fails the build on a price outside
      # $0.00-$1.00, a crossed book, an alert below $0.10, an undocumented status, a broken
      # internal link or a committed credential.
      - name: Verify the live desk and the cross-implementation data audit
        run: |
          python3 -m unittest discover -s live/tests
          python3 live/build_page.py --check
          python3 qa/audit.py --check
      # Audit (session 73552f24): every finding re-checked, pages current, a source
      # link on every row. Fails the build if a published verdict goes stale.
      - name: Verify the audit site
        run: |
          python3 audit/verify.py --check
          python3 audit/build_site.py --check
          python3 audit/check_site.py
      - name: Verify Demo API desk and V2 engine (session 17d84e4f)
        run: |
          python3 kalshi_engine/test_engine.py
          python3 demo-desk/check_live_site.py
          node --test demo-desk/test_live_core.mjs
      - name: Fetch bounded public demo snapshot
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_snapshot.py
      - name: Commit the refreshed snapshot
        # Both this job and collect.yml commit to main; they share the `main-writers`
        # concurrency group above, and the push is retried after a rebase in case a
        # collector commit lands between checkout and push.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "kalshi-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "data: pages snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed; retrying"; sleep 10
            done
          fi
      - name: Stage the landing page, every dashboard and the board app
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html .nojekyll public/
          cp -R docs site demo-desk audit public/
          # The Node board app (session 9bea7e55): generated pages, their assets,
          # the five category pages and the JSON those pages read. Repository
          # internals (tools, tests, workflows) are never published.
          cp ./*.html public/
          cp -R assets categories data public/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

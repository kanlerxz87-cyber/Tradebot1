name: Verify and deploy both Pages dashboards
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify both sessions' code and local links
        run: |
          npm install --no-audit --no-fund
          node --test tests/*.test.mjs
          python3 tests/check_site.py
          python3 python/test_simulator.py
          node --check site/assets/app.js
      # Research desk (session e3e5f70f): unit tests, generated tables current, no broken links.
      - name: Verify the research desk under docs/desk
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m pytest -q
          python3 tools/build_site.py --check
          python3 tools/check_links.py
      # Session arena-35fb0d1f: the live desk's unit tests, its generated page, and the
      # cross-implementation audit. --check fails the build on a price outside $0.00-$1.00,
      # a crossed book, an alert below $0.10, an undocumented status, a broken internal
      # link or a committed credential.
      - name: Verify the live desk and the cross-implementation audit
        run: |
          python3 -m unittest discover -s live/tests
          python3 live/build_page.py --check
          python3 qa/audit.py --check
      - name: Fetch bounded public demo snapshot
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_snapshot.py
      - name: Stage the landing page, every dashboard and the board app
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html .nojekyll public/
          cp -R docs site public/
          # The Node board app (session 9bea7e55): generated pages, their assets,
          # the five category pages and the JSON those pages read. Repository
          # internals (tools, tests, workflows) are never published.
          cp ./*.html public/
          cp -R assets categories data public/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

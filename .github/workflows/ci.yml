name: CI

on:
  push:
    paths-ignore:
      - "docs/data/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Verify published data integrity
        run: |
          if [ -f docs/desk/data/latest.json ]; then
            python -m kalshi_trader.cli verify
          else
            echo "no snapshot yet — skipping data integrity check"
          fi

      - name: Site generation is current
        run: python tools/build_site.py --check

      - name: No broken internal links
        run: python tools/check_links.py

      - name: Root gateway links are alive and published
        run: python tools/check_gateway.py

      - name: Engine site links and source links
        run: python -m engine.check_site --root docs/engine

      - name: No credentials in the tree
        run: |
          set -e
          if git grep -nE "BEGIN (RSA |EC |)PRIVATE KEY|KALSHI-ACCESS-SIGNATURE: [A-Za-z0-9+/]{40}" -- . ':!*.md' ':!docs/assets/**'; then
            echo "::error::possible private key material committed"
            exit 1
          fi
          echo "no key material found"

  # ---------------------------------------------------------------------------
  # Independent audit (session 73552f24). Re-runs every finding's check, so a
  # page cannot keep publishing a verdict the code no longer supports.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Re-run every audit check
        run: python3 audit/verify.py --check

      - name: Audit pages match their data
        run: python3 audit/build_site.py --check

      - name: Source link on every row, no broken links
        run: python3 audit/check_site.py

      - name: Audit regression tests
        run: python -m pytest -q tests/test_audit.py

  # ---------------------------------------------------------------------------
  # Node dashboard (session 9bea7e55). Independent of the Python job above:
  # it generates the root pages under board.html and friends from templates,
  # and fails if a table row loses its source link.
  # ---------------------------------------------------------------------------
  node-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test-only dependency
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Data contract
        run: node scripts/check-data.mjs

      - name: Build the site
        run: node scripts/build-site.mjs

      - name: Committed HTML matches templates and data
        run: node scripts/build-site.mjs --check

      - name: Internal links, assets and anchors
        run: node scripts/check-links.mjs

      - name: Every page renders its data with source links
        run: node scripts/check-render.mjs

  demo-desk-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run kalshi_engine V2 unit tests and demo-desk/ link & source checks
        run: |
          python3 kalshi_engine/test_engine.py
          python3 demo-desk/check_live_site.py
          node --test demo-desk/test_live_core.mjs

name: Demo account snapshot

# The only job that signs a Kalshi request. It reads the demo account's balance,
# positions, fills and settlements, and commits them to data/account.json.
#
# Without KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY in repository secrets it
# writes a "not connected" snapshot with the reason and the steps to fix it,
# rather than a zero balance that would look like an empty account.
#
# It never places an order.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-account-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the demo account
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_REST_ROOT: https://external-api.demo.kalshi.co/trade-api/v2
        run: node tools/demo-account.mjs

      - name: Validate the committed data against its contract
        run: node scripts/check-data.mjs

      - name: Commit the snapshot
        run: |
          set -euo pipefail
          git config user.name 'kalshi-demo-account'
          git config user.email 'kalshi-demo-account@users.noreply.github.com'
          git add data/account.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          node scripts/build-site.mjs
          node scripts/check-links.mjs
          git add data/account.json \
            board.html dashboard.html markets.html market.html portfolio.html \
            strategies.html demo-account.html executive-summary.html sources.html \
            methodology.html suggestions.html flagged.html api.html 404.html \
            categories/gas.html categories/elections.html categories/culture.html \
            categories/crypto.html categories/golf.html
          git commit -m "data: demo account snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::could not push the snapshot"
          exit 1
